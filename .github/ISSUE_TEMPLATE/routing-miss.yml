name: Routing miss
description: Claude picked the wrong agent or skill, or did not pick one when it should have.
title: "[Routing] "
labels: ["routing-miss"]
body:
  - type: markdown
    attributes:
      value: |
        Every agent, skill and command here has a description that tells Claude when to use it. When Claude picks the wrong one, or none, the description is what needs fixing. These reports are some of the most useful feedback we get, and they are often a good first contribution to fix yourself.
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
      description: The prompt or request, as close to verbatim as you can share. Replace real names, phone numbers, group ids and message text with placeholders.
      placeholder: "what did the team say about the release?"
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: What should have run
      placeholder: "plugin:skill, e.g. pull:chat-pull"
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: What ran instead
      placeholder: "e.g. grab:chat-grab, a skill from another pack, or nothing"
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "claude --version, the plugin version from /plugin, and your provider (e.g. Periskope)"
  - type: checkboxes
    id: fix
    attributes:
      label: Want to fix it?
      options:
        - label: I would like to open a pull request that sharpens the description.
  - type: checkboxes
    id: credit
    attributes:
      label: Credit
      options:
        - label: If this feedback leads to a change, you may credit my GitHub handle in the changelog and release notes.
